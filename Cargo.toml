[package]
name = "rustembarque"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32l476rg", "defmt", "time-driver-any"] }
embassy-executor = { version = "0.5", features = ["arch-cortex-m", "executor-thread", "defmt", "nightly"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "generic-queue-8"] }
embassy-sync = { version = "0.5", features = ["defmt"] }

[[bin]]
name = "bargraph_example"
path = "src/bin/bargraph_example.rs"

[[bin]]
name = "gamepad_example"
path = "src/bin/gamepad_example.rs"

[[bin]]
name = "rotary_encoder_example"
path = "src/bin/rotary_encoder_example.rs"

[profile.release]
debug = 2